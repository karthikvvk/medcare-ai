name: Build & Deploy MedCare AI

# Triggers on every push to main branch
on:
  push:
    branches:
      - main

env:
  # GitHub Container Registry (free, no ECR needed)
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}      # e.g. ghcr.io/karthikvvk/medcare-ai

jobs:
  # --- Job 1: Build & Push Docker Image ----------------------------
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # needed to push to GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # auto-provided, no setup needed

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # --- Job 2: Deploy to EC2 ----------------------------------------
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push      # waits for image to be pushed first
    permissions:
      packages: read

    steps:
      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}         # your EC2 Elastic IP
          username: ${{ secrets.EC2_USER }}         # usually 'ubuntu' or 'ec2-user'
          key:      ${{ secrets.EC2_SSH_KEY }}      # your EC2 private key (PEM contents)
          script: |
            # Log in to GHCR on the EC2 machine
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin

            # Pull the latest image
            docker pull ghcr.io/${{ github.repository }}:latest

            # Stop and remove the old container (ignore error if not running)
            docker stop medcare-ai || true
            docker rm   medcare-ai || true

            # Start the new container
            # /data/medcare is the EBS mount point for SQLite persistence
            docker run -d \
              --name medcare-ai \
              --restart unless-stopped \
              -p 8000:8000 \
              -v /data/medcare:/workspace \
              --env-file /home/ubuntu/medcare.env \
              ghcr.io/${{ github.repository }}:latest

            # Wait for health check to pass
            sleep 15
            curl -sf http://localhost:8000/api/health && echo "Deployment successful" \
              || echo "Health check failed - check: docker logs medcare-ai"
