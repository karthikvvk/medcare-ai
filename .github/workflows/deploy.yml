name: Build & Deploy MedCare AI

# Triggers on every push to main branch
on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # ghcr.io/karthikvvk/medcare-ai

jobs:
  # ── Job 1: Build & Push to GHCR (free image registry) ──────────
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # auto-provided by GitHub

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ── Job 2: Deploy to Amazon Linux EC2 ───────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      packages: read

    steps:
      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}      # Elastic IP
          username: ec2-user                     # Amazon Linux default user
          key:      ${{ secrets.EC2_SSH_KEY }}   # PEM key contents

          script: |
            # Login to GHCR
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin

            # Pull latest image
            docker pull ghcr.io/${{ github.repository }}:latest

            # Stop old container gracefully
            docker stop medcare-ai || true
            docker rm   medcare-ai || true

            # Start fresh container
            # /data/medcare = EBS mount for SQLite persistence
            docker run -d \
              --name medcare-ai \
              --restart unless-stopped \
              -p 8000:8000 \
              -v /data/medcare:/data \
              --env-file /home/ec2-user/medcare.env \
              ghcr.io/${{ github.repository }}:latest

            # Health check
            sleep 20
            curl -sf http://localhost:8000/api/health \
              && echo "Deployment successful" \
              || (echo "Health check failed" && docker logs --tail 30 medcare-ai)
