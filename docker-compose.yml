version: '3.8'

services:
  # MedCare Control Tower Service (API & Web Dashboard)
  control-tower:
    build: .
    container_name: medcare_control_tower
    volumes:
      - .:/workspace
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./medcare_pharma.db
      - API_BASE_URL=http://localhost:8000
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload
